[project]
name = "reviewing-agents"
version = "0.1.0"
description = "A general package for AI reviewing of academic papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.43.0",
    "litellm>=1.74.7",
    "markdownify>=1.2.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.2",
    "openreview-py>=1.51.2",
    "pandas>=2.3.1",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "pypdf>=5.9.0",
    "pyyaml>=6.0.0",
    "reportlab>=4.4.3",
    "requests>=2.32.4",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "smolagents>=1.21.1",
    "streamlit>=1.51.0",
    "tavily-python>=0.7.10",
    "tenacity>=9.1.2",
    "tqdm>=4.64.0",
    "transformers>=4.55.0",
    "umap-learn>=0.5.9.post2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "F", "I", "W"]
ignore = []
exclude = ["*.ipynb"]

[tool.ruff.isort]
known-first-party = ["reviewing-agents"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
markers = [
    "fast: Fast tests that don't require external API calls",
    "slow: Slow tests that may require external API calls",
    "integration: Integration tests that test the full system",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
